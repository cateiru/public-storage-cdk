name: Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug OIDC token claims
        run: |
          resp=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          token=$(echo "$resp" | jq -r .value)
          payload=$(echo "$token" | cut -d. -f2)
          python3 -c "
import base64, json, sys
p = sys.argv[1]
p += '=' * (-len(p) % 4)
print(json.dumps(json.loads(base64.urlsafe_b64decode(p)), indent=2))
" "$payload"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::211125784910:role/github-actions-public-storage
          aws-region: us-east-1
          role-skip-session-tagging: true

      - name: Sync to S3
        run: aws s3 sync ./public s3://cateiru-public-storage/ --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id EQG76YTTJCT7N --paths "/*"
