name: Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::211125784910:role/github-actions-public-storage
          aws-region: us-east-1
          role-skip-session-tagging: true

      - name: Sync to S3
        run: aws s3 sync ./public s3://cateiru-public-storage/ --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id EQG76YTTJCT7N --paths "/*"
